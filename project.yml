name: PinSnip
options:
  bundleIdPrefix: com.longhai
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "4"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ENABLE_APPINTENTS_METADATA_GENERATION: false
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.2
targets:
  PinSnip:
    type: application
    platform: macOS
    sources:
      - PinSnip/App
      - PinSnip/Capture
      - PinSnip/Hotkeys
      - PinSnip/Output
      - PinSnip/Pins
      - path: PinSnip/Resources/PinSnip.icns
        buildPhase: resources
    dependencies:
      - target: PinSnipCore
        embed: true
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.longhai.pinsnip
        PRODUCT_NAME: PinSnip
        INFOPLIST_FILE: PinSnip/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
        ENABLE_HARDENED_RUNTIME: true
  PinSnipCore:
    type: framework
    platform: macOS
    sources:
      - path: PinSnip/Core
      - path: PinSnip/Annotations
        optional: true
      - path: PinSnip/Clipboard
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.longhai.pinsnip.core
        GENERATE_INFOPLIST_FILE: true
  PinSnipTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PinSnipTests
    dependencies:
      - target: PinSnipCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.longhai.pinsnip.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  PinSnip:
    build:
      targets:
        PinSnip: all
        PinSnipCore: all
        PinSnipTests: [test]
    test:
      targets:
        - PinSnipTests
